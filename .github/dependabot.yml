version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # `typescript-eslint` bounds `typescript` (peerDependencies `>=4.8.4 <6.1.0`, checked in 8.71.2); pnpm only makes it a warning. Undo the group when the bound goes away.
      typescript:
        patterns: ["typescript", "typescript-eslint", "vue-tsc"]
      # `@vitest/browser-playwright` pins `vitest` to the exact version (peerDependencies `vitest: 5.0.3`, checked in 5.0.3): bumping one without the other does not resolve.
      vitest:
        patterns: ["vitest", "@vitest/*"]
      # `vue` and `@vue/reactivity` are published together, at the same version: `src/core/signals.ts` uses the latter, and two installed versions would make two reactive systems that do not see each other.
      vue:
        patterns: ["vue", "@vue/reactivity"]
      mineures:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript 7, the native rewrite of the compiler, no longer has the JavaScript API that `vue-tsc` 3.3 and `typescript-eslint` 8.71 depend on (observed in ssk-it/skift#6, on 10 October 2026). Reopen when both support it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # All actions in a single pull request: each one modifies `controles.yml`, and separate pull requests conflict as soon as the first one is merged.
      actions:
        patterns: ["*"]
