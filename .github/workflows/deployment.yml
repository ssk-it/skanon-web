# Deploys the web version to Object Storage, on every merge to `main`, and by hand.
#
# Skanon is served where SSK Canon was, from the same bucket: its files replace those of the Angular PWA, and its service worker takes over from the old one wherever it was installed (docs/deployment.md). What holds a merge back from the site is the `production` environment: it only accepts `main`, and waits for a reviewer's approval.
name: Deployment

on:
  push:
    branches: [main]
  # Deploys the branch the run is started on, which the environment restricts to `main`. No input names another reference: it would check out code the environment never approved, under its secrets. Rolling back is a revert on `main`.
  workflow_dispatch:

permissions:
  contents: read

# Two deployments never cross: the order the files arrive in would decide which version is served. None is cancelled: a half-written deployment would leave the site inconsistent.
concurrency:
  group: deployment
  cancel-in-progress: false

jobs:
  # The dependencies run here, and only here: this job sees no secret. The deploy job runs no code of the repo or of its dependencies, only the AWS CLI of the runner image on the files built here.
  build:
    name: Build the web version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the version from `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:web

      - uses: actions/upload-artifact@v7
        with:
          name: dist-web
          path: dist-web
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to the bucket
    needs: build
    runs-on: ubuntu-latest
    environment: production

    # The credentials as environment variables, not through `aws-actions/configure-aws-credentials`: that action calls `sts:GetCallerIdentity` on a host it derives from the region, `sts.fr-par.amazonaws.com`, which does not exist. The region only serves the SigV4 signature, which Scaleway checks identically.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ vars.SCW_REGION }}
      AWS_REGION: ${{ vars.SCW_REGION }}
      # Recent CLI versions add checksums that Scaleway's S3 implementation rejects.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ENDPOINT: https://s3.${{ vars.SCW_REGION }}.scw.cloud
      BUCKET: s3://${{ vars.SCW_BUCKET }}

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-web
          path: dist-web

      # 1. Hashed files: Vite puts them all under `assets/`, and a changed content arrives under another name. Immutable, cached for a year.
      - name: Upload the hashed files
        run: |
          aws s3 sync dist-web/assets "$BUCKET/assets" --endpoint-url "$ENDPOINT" \
            --cache-control 'public, max-age=31536000, immutable'

      # 2. Images with a stable name — icons, logos. A replaced logo must show: one day, then revalidation, where the ETag yields a 304 without transfer.
      - name: Upload the stable-name images
        run: |
          aws s3 sync dist-web "$BUCKET" --endpoint-url "$ENDPOINT" \
            --cache-control 'public, max-age=86400, must-revalidate' \
            --exclude '*' --exclude 'assets/*' \
            --include '*.png' --include '*.svg' --include '*.ico' --include 'icons/*'

      # 3. The entry points, last: `index.html`, the manifest and the service workers — Skanon's, and the one that takes over from the old application under `ngsw-worker.js`. They decide which version loads; cached, they would freeze browsers on the old one despite a successful deployment. Until they are uploaded, the previous version is served whole.
      - name: Upload the entry points
        run: |
          aws s3 sync dist-web "$BUCKET" --endpoint-url "$ENDPOINT" \
            --cache-control 'no-cache, must-revalidate' \
            --exclude '*' --exclude 'assets/*' \
            --include '*.html' --include '*.js' --include '*.json' --include '*.webmanifest'

      # 4. Nothing is deleted — `sync --delete` would remove files of a version still requested by an open tab, and cleaning up is the job of a lifecycle rule on the bucket —, except `ngsw.json`, the manifest of the old Angular PWA. While it answers, its service worker keeps serving the old version from its cache; once it answers 404, that service worker unregisters itself. Harmless once removed: the step replays without damage.
      - name: Remove the old PWA's manifest
        run: aws s3 rm "$BUCKET/ngsw.json" --endpoint-url "$ENDPOINT"

      - name: Summarise
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            echo "- Bucket: \`${{ vars.SCW_BUCKET }}\` (${{ vars.SCW_REGION }})"
          } >> "$GITHUB_STEP_SUMMARY"
