name: Checks

on:
  pull_request:
  push:
    branches: [main]

# GitHub's runners, and not ssk-it's Macs as elsewhere in the organisation: the repo is public, and a pull request from a fork runs its code on the runner. A fresh runner for each job keeps nothing of what a third party did on it.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interface:
    name: Interface (types, lint, format, tests, web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the version from `packageManager`.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      # No --fix: CI observes, it does not correct.
      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - name: Build the web version
        run: pnpm exec vite build --mode web

  navigateur:
    name: Browser (headless WebKit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install WebKit and its dependencies
        run: pnpm exec playwright install --with-deps webkit

      - name: Browser tests
        run: pnpm test:browser
