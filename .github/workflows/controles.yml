name: Checks

on:
  pull_request:
  push:
    branches: [main]

# GitHub's runners, and not ssk-it's Macs as elsewhere in the organisation: the repo is public, and a pull request from a fork runs its code on the runner. A fresh runner for each job keeps nothing of what a third party did on it.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interface:
    name: Interface (types, lint, format, tests, web build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # SonarCloud tells new code from old by the history.
          fetch-depth: 0

      # Reads the version from `packageManager`.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      # No --fix: CI observes, it does not correct.
      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Tests
        run: pnpm test:coverage

      # GitHub gives no secret to a pull request from a fork: the analysis is skipped there rather than failing the checks. Only whether the token exists comes out of this step, and only the analysis step sees the token — not the install, not the tests, which run the dependencies' code.
      - name: SonarCloud token
        id: sonar
        run: echo "present=${{ secrets.SONAR_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: SonarCloud analysis
        if: steps.sonar.outputs.present == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build the web version
        run: pnpm exec vite build --mode web

  navigateur:
    name: Browser (headless WebKit)
    runs-on: ubuntu-latest
    # Playwright's image already carries WebKit and its system libraries. `playwright install --with-deps` fetched 117 MB of packages from the runner's apt mirror: 9 s on a good day, 21 to 52 minutes on 26 October 2026. Keep the tag on the `playwright` version of `package.json`.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A no-op while the image matches `package.json`; after a Playwright bump ahead of the image, it downloads the new WebKit (a few seconds, from Playwright's CDN, not apt).
      - name: Install WebKit
        run: pnpm exec playwright install webkit

      - name: Browser tests
        run: pnpm test:browser
