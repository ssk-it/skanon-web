name: CLA

# Every commit author of a pull request signs the CLA before it is merged (ADR-contributions-relicenciables, 2026-059/07). A signature is a comment on the pull request; it is kept on the `cla-signatures` branch, and the result is the `CLA` commit status that `main`'s protection requires. The logic, and its tests: `tools/cla/`.

on:
  # `pull_request_target`, not `pull_request`: a pull request from a fork gets a read-only token, which can neither set a status nor record a signature. This trigger runs the workflow of the default branch, with a token that can write — which is why nothing of the pull request is ever checked out or run here.
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# One run at a time per pull request, none cancelled: a signature posted during a push must still be recorded.
concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write # the `cla-signatures` branch
  statuses: write # the `CLA` status
  pull-requests: write # the check's comment

jobs:
  cla:
    name: CLA
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      # The default branch, explicitly: the CLA and the check are those already merged, never a pull request's version of them.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Pinned to a commit, unlike the other workflows' actions: this one runs with a token that can write on third parties' pull requests.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { readFileSync } = await import("node:fs");
            const { checkCla } = await import(`${process.env.GITHUB_WORKSPACE}/tools/cla/check.mjs`);
            await checkCla({ github, context, claText: readFileSync("CLA.md", "utf8") });
