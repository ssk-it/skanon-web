# The analysis CI runs (`.github/workflows/controles.yml`), with the coverage of the jsdom and tooling tests.
sonar.organization=ssk-it
sonar.projectKey=ssk-it_skanon-web

sonar.sources=src,tools
sonar.tests=src,tools
sonar.exclusions=src/**/*.test.ts,tools/**/*.test.mjs,tools/**/*.test.ts
sonar.test.inclusions=src/**/*.test.ts,tools/**/*.test.mjs,tools/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# A catalogue's English half has, by rule, exactly the French half's shape
# (docs/conventions.md): duplication detection, which ignores string
# contents, would read every catalogue as a copy of itself.
sonar.cpd.exclusions=src/**/*.messages.ts
# The test tooling, which no test covers by construction: the same list as
# `coverage.exclude` in vite.config.ts.
sonar.coverage.exclusions=src/test-setup.ts,src/core/http/http-testing.ts
