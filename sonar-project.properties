# The analysis CI runs (`.github/workflows/controles.yml`), with the jsdom tests' coverage.
sonar.organization=ssk-it
sonar.projectKey=ssk-it_skanon-web

sonar.sources=src,tools
sonar.tests=src
sonar.exclusions=src/**/*.test.ts
sonar.test.inclusions=src/**/*.test.ts
sonar.javascript.lcov.reportPaths=coverage/lcov.info
